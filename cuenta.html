<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | Sevirum</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<script src="js/script.js"></script>
<body>

<header class="header">
  <div class="logo-box">
    <img src="imagenes/logo.png" alt="Logo Sevirum">
    <h1>SEVIRUM</h1>
  </div>

  <nav>
    <a href="index.html">Noticias</a>
    <a href="cuenta.html">Cuenta</a>
    <a href="terminos.html">Términos y condiciones</a>
  </nav>
</header>

<main class="cuenta-container">

  <div class="formulario-box">
    <h2>Crear cuenta</h2>
    <p>Únete a la comunidad de Sevirum.</p>

    <form>

      <div class="input-group">
        <label>Nombres</label>
        <input type="text" placeholder="Introduce tus nombres">
      </div>

      <div class="input-group">
        <label>Apellidos</label>
        <input type="text" placeholder="Introduce tus apellidos">
      </div>

      <div class="input-group">
        <label>Correo electrónico</label>
        <input type="email" placeholder="ejemplo@correo.com">
      </div>

      <div class="input-group">
        <label>Número de teléfono</label>
        <input type="tel" placeholder="+34 600 000 000">
      </div>

      <div class="input-group">
        <label>Nickname</label>
        <input type="text" placeholder="Tu nombre gamer">
      </div>

      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" placeholder="Introduce una contraseña">
      </div>

      <div class="input-group">
        <label>Verificación de contraseña</label>
        <input type="password" placeholder="Repite la contraseña">
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="terminos">
        <label for="terminos">
          Acepto los términos y condiciones
        </label>
      </div>

      <button type="submit" class="crear-btn">
        Crear cuenta
      </button>

    </form>
  </div>

</main>

<footer>
  <div class="footer-logo">
    <img src="imagenes/logo.png" alt="Logo Sevirum">
    <h2>SEVIRUM</h2>
    <p>Tu fuente de noticias sobre videojuegos, actualizaciones y eventos.</p>
  </div>

  <div class="redes">
    <h3>Síguenos en nuestras redes</h3>
    <div class="iconos">
      <a href="#">TikTok</a>
      <a href="#">Instagram</a>
      <a href="#">Steam</a>
      <a href="#">Correo</a>
    </div>
  </div>
</footer>

</body>
</html>
